
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/example_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  
  sql:
    init:
      encoding: UTF-8
      mode: never
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 15MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true

# JWT配置
jwt:
  secret: dorm-repair-secret-key-2024-secure-enough-for-jwt-hs256-algorithm-minimum-256-bits
  expiration: 86400000

# 文件上传配置
upload:
  path: ./uploads/
