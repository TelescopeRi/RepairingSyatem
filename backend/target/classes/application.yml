server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dorm-repair-system-secret-key-2024}
  expiration: 86400000

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:repair_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-underline: true

agent:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    timeout: 60000
    temperature: 0.7

upload:
  path: ${UPLOAD_PATH:uploads}  # 支持环境变量覆盖，默认为相对路径

logging:
  level:
    com.dorm.repair: DEBUG